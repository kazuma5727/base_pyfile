name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package and test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Run lightweight tests
        run: python -m pytest -q

  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build tools
        run: python -m pip install build twine
      - name: Build sdist and wheel
        run: python -m build
      - name: Check package metadata
        run: python -m twine check dist/*
      - name: Check package contents
        run: python scripts/check_dist.py
      - name: Install wheel and smoke test
        run: |
          python -m pip install --force-reinstall --no-deps (Get-ChildItem dist/*.whl).FullName
          python -I -c "import base_pyfile, importlib.metadata as metadata; assert metadata.version('base_pyfile') == base_pyfile.__version__; print('installed', base_pyfile.__version__)"
          python -I -c "import importlib.util; assert importlib.util.find_spec('base_pyfile.dev') is None; print('base_pyfile.dev is not installed')"
          python -I -m base_pyfile version
          base-pyfile --version
